<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WargaConnect - Komunitas Lokal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20 selection:bg-indigo-500 selection:text-white">

  <!-- HEADER NAVBAR -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40 transition-all">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
          <i class="fa-solid fa-users text-sm"></i>
        </div>
        <span class="font-extrabold text-xl bg-gradient-to-r from-indigo-600 to-blue-600 bg-clip-text text-transparent tracking-tight">WargaConnect</span>
      </div>

      <div id="navUser" class="hidden flex items-center space-x-2">
        <div id="userAvatarNav" class="w-8 h-8 rounded-full bg-slate-200 overflow-hidden ring-2 ring-indigo-500/30 flex items-center justify-center font-semibold text-xs text-indigo-700"></div>
        <button onclick="logout()" title="Keluar" class="w-8 h-8 rounded-full bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- FORM LOGIN & REGISTER -->
    <div id="authSection" class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 my-6">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl">
          <i class="fa-solid fa-house-chimney-user"></i>
        </div>
        <h2 id="authTitle" class="text-xl font-bold text-slate-800">Masuk Akun Warga</h2>
        <p class="text-xs text-slate-400 mt-1">Terhubung kembali dengan tetangga & lingkunganmu</p>
      </div>
      
      <div class="space-y-3.5">
        <div id="nameGroup" class="hidden">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="text" id="fullName" placeholder="Pak Budi / Bu Rahayu" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
          <div class="relative">
            <i class="fa-regular fa-envelope absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="email" id="email" placeholder="nama@email.com" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kata Sandi</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            <input type="password" id="password" placeholder="Minimal 6 karakter" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
          </div>
        </div>
        
        <p id="authError" class="text-red-500 text-xs font-medium bg-red-50 p-2.5 rounded-lg border border-red-100 hidden text-center"></p>

        <button id="authBtn" onclick="handleAuth()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold py-3 rounded-xl text-xs shadow-lg shadow-indigo-500/30 transition-all">
          Masuk
        </button>
        
        <p class="text-xs text-center text-slate-500 pt-2">
          <span id="authToggleText">Belum punya akun?</span>
          <button onclick="toggleAuthMode()" id="authToggleBtn" class="text-indigo-600 font-bold hover:underline ml-1">Daftar sekarang</button>
        </p>
      </div>
    </div>

    <!-- MAIN APP / FEED -->
    <div id="appSection" class="hidden space-y-4">

      <!-- CARD BUAT STATUS -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/60">
        <div class="flex items-start space-x-3">
          <img id="userPostAvatar" src="" class="w-9 h-9 rounded-full bg-slate-100 object-cover ring-2 ring-indigo-500/20" alt="Avatar">
          <div class="flex-1">
            <textarea id="postInput" rows="2" placeholder="Apa info atau kabar warga hari ini?" class="w-full text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-200/80 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition placeholder:text-slate-400"></textarea>
          </div>
        </div>
        <div class="flex items-center justify-between pt-3 mt-2 border-t border-slate-100">
          <div class="flex items-center space-x-3 text-slate-400 text-xs px-1">
            <button class="hover:text-indigo-600 transition flex items-center space-x-1"><i class="fa-regular fa-image text-emerald-500"></i><span class="text-[11px] font-medium text-slate-500">Foto</span></button>
            <button class="hover:text-indigo-600 transition flex items-center space-x-1"><i class="fa-solid fa-bullhorn text-amber-500"></i><span class="text-[11px] font-medium text-slate-500">Info</span></button>
          </div>
          <button onclick="createPost()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold px-4 py-1.5 rounded-xl text-xs shadow-md shadow-indigo-500/20 transition-all flex items-center space-x-1.5">
            <span>Bagikan</span>
            <i class="fa-solid fa-paper-plane text-[10px]"></i>
          </button>
        </div>
      </div>

      <!-- FEED POSTINGAN -->
      <div id="postsFeed" class="space-y-3.5">
        <div class="bg-white p-8 rounded-2xl shadow-sm text-center">
          <i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-xl mb-2"></i>
          <p class="text-xs text-slate-400 font-medium">Memuat kabar tetangga...</p>
        </div>
      </div>

    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav id="bottomNav" class="hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200/80 py-2.5 px-6 z-40 max-w-md mx-auto flex justify-between items-center text-slate-400 text-xs">
    <button class="flex flex-col items-center space-y-1 text-indigo-600 font-semibold">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[10px]">Beranda</span>
    </button>
    <button class="flex flex-col items-center space-y-1 hover:text-slate-600">
      <i class="fa-solid fa-user-group text-base"></i>
      <span class="text-[10px]">Warga</span>
    </button>
    <button class="flex flex-col items-center space-y-1 hover:text-slate-600">
      <i class="fa-solid fa-store text-base"></i>
      <span class="text-[10px]">Lapak</span>
    </button>
    <button class="flex flex-col items-center space-y-1 hover:text-slate-600">
      <i class="fa-regular fa-bell text-base"></i>
      <span class="text-[10px]">Notif</span>
    </button>
  </nav>

  <script>
    // ==========================================
    // 1. KONFIGURASI FIREBASE (TEMPEL MILIKMU)
    // ==========================================
    
const firebaseConfig = {
  apiKey: "AIzaSyCYaNVjgQnFgyO-Gtp-sydg8FfJFfaV75A",
  authDomain: "bloxm-6149b.firebaseapp.com",
  projectId: "bloxm-6149b",
  storageBucket: "bloxm-6149b.firebasestorage.app",
  messagingSenderId: "966768995931",
  appId: "1:966768995931:web:32c0c39aec7ed5a9fd997e"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let isRegisterMode = false;

    // ==========================================
    // 2. MANAJEMEN AUTENTIKASI
    // ==========================================
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        const displayName = user.displayName || user.email.split('@')[0];
        const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=6366f1&color=fff&bold=true`;

        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('navUser').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');

        document.getElementById('userAvatarNav').innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover">`;
        document.getElementById('userPostAvatar').src = avatarUrl;

        loadPosts();
      } else {
        currentUser = null;
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('navUser').classList.add('hidden');
        document.getElementById('bottomNav').classList.add('hidden');
      }
    });

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('nameGroup').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('authTitle').innerText = isRegisterMode ? 'Daftar Warga Baru' : 'Masuk Akun Warga';
      document.getElementById('authBtn').innerText = isRegisterMode ? 'Daftar' : 'Masuk';
      document.getElementById('authToggleText').innerText = isRegisterMode ? 'Sudah punya akun?' : 'Belum punya akun?';
      document.getElementById('authToggleBtn').innerText = isRegisterMode ? 'Masuk di sini' : 'Daftar sekarang';
      document.getElementById('authError').classList.add('hidden');
    }

    async function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const fullName = document.getElementById('fullName').value.trim();
      const errEl = document.getElementById('authError');
      errEl.classList.add('hidden');

      if (!email || !password) {
        errEl.innerText = "Email dan password wajib diisi!";
        errEl.classList.remove('hidden');
        return;
      }

      try {
        if (isRegisterMode) {
          if (!fullName) {
            errEl.innerText = "Nama lengkap wajib diisi!";
            errEl.classList.remove('hidden');
            return;
          }
          const res = await auth.createUserWithEmailAndPassword(email, password);
          await res.user.updateProfile({ displayName: fullName });
          await db.collection('users').doc(res.user.uid).set({
            uid: res.user.uid,
            name: fullName,
            email: email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        errEl.innerText = err.message;
        errEl.classList.remove('hidden');
      }
    }

    function logout() {
      auth.signOut();
    }

    // ==========================================
    // 3. FITUR POSTINGAN & KOMENTAR (REAL-TIME)
    // ==========================================
    async function createPost() {
      const text = document.getElementById('postInput').value.trim();
      if (!text) return;

      try {
        await db.collection('posts').add({
          content: text,
          authorUid: currentUser.uid,
          authorName: currentUser.displayName || "Warga Anonim",
          likes: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('postInput').value = '';
      } catch (err) {
        alert("Gagal membuat status: " + err.message);
      }
    }

    function loadPosts() {
      db.collection('posts')
        .orderBy('createdAt', 'desc')
        .onSnapshot((snapshot) => {
          const feed = document.getElementById('postsFeed');
          feed.innerHTML = '';

          if (snapshot.empty) {
            feed.innerHTML = `
              <div class="bg-white p-8 rounded-2xl shadow-sm text-center border border-slate-100">
                <i class="fa-regular fa-comments text-slate-300 text-3xl mb-2"></i>
                <p class="text-xs text-slate-500 font-medium">Belum ada pengumuman atau kabar warga.</p>
              </div>`;
            return;
          }

          snapshot.forEach((doc) => {
            const data = doc.data();
            const postId = doc.id;
            const likesCount = data.likes ? data.likes.length : 0;
            const isLiked = data.likes && data.likes.includes(currentUser.uid);
            const authorName = data.authorName || "Warga";
            const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(authorName)}&background=random`;

            const postEl = document.createElement('div');
            postEl.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-200/60 space-y-3 transition";
            postEl.innerHTML = `
              <!-- Header Post -->
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                  <img src="${avatarUrl}" class="w-9 h-9 rounded-full object-cover ring-2 ring-slate-100" alt="Avatar">
                  <div>
                    <h4 class="font-bold text-slate-800 text-xs leading-tight">${escapeHtml(authorName)}</h4>
                    <span class="text-[10px] font-semibold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded-md">Warga Tetangga</span>
                  </div>
                </div>
                <button class="text-slate-300 hover:text-slate-500 text-xs p-1"><i class="fa-solid fa-ellipsis-vertical"></i></button>
              </div>

              <!-- Isi Post -->
              <p class="text-slate-700 text-xs leading-relaxed whitespace-pre-line px-0.5">${escapeHtml(data.content)}</p>
              
              <!-- Action Bar (Like & Count) -->
              <div class="flex items-center justify-between pt-2.5 border-t border-slate-100 text-xs">
                <button onclick="toggleLike('${postId}', ${isLiked})" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl transition ${isLiked ? 'bg-rose-50 text-rose-600 font-semibold' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="${isLiked ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart text-sm"></i>
                  <span class="text-xs">${likesCount} Suka</span>
                </button>
                <div class="text-[11px] text-slate-400 font-medium">
                  <i class="fa-regular fa-comment text-slate-400 mr-1"></i>Komentar
                </div>
              </div>

              <!-- Section Komentar -->
              <div class="pt-2 space-y-2 bg-slate-50/80 p-3 rounded-xl border border-slate-100">
                <div id="comments-${postId}" class="space-y-2 max-h-48 overflow-y-auto hide-scrollbar">
                  <p class="text-[11px] text-slate-400 italic text-center">Memuat komentar...</p>
                </div>
                
                <!-- Input Komentar -->
                <div class="flex items-center space-x-2 pt-1">
                  <input type="text" id="input-comment-${postId}" placeholder="Tulis tanggapan..." class="w-full px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                  <button onclick="addComment('${postId}')" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs px-3 py-1.5 rounded-xl transition shadow-sm font-medium">
                    <i class="fa-solid fa-paper-plane text-[10px]"></i>
                  </button>
                </div>
              </div>
            `;
            feed.appendChild(postEl);
            loadComments(postId);
          });
        });
    }

    async function toggleLike(postId, isLiked) {
      const postRef = db.collection('posts').doc(postId);
      if (isLiked) {
        await postRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
      } else {
        await postRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
      }
    }

    function loadComments(postId) {
      db.collection('posts').doc(postId).collection('comments')
        .orderBy('createdAt', 'asc')
        .onSnapshot((snapshot) => {
          const commentContainer = document.getElementById(`comments-${postId}`);
          commentContainer.innerHTML = '';

          if (snapshot.empty) {
            commentContainer.innerHTML = '<p class="text-[11px] text-slate-400 italic text-center">Belum ada komentar.</p>';
            return;
          }

          snapshot.forEach((doc) => {
            const cData = doc.data();
            const cAuthor = cData.authorName || "Warga";
            const cAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(cAuthor)}&background=random`;

            const div = document.createElement('div');
            div.className = "flex items-start space-x-2 text-xs bg-white p-2 rounded-lg border border-slate-100 shadow-2xs";
            div.innerHTML = `
              <img src="${cAvatar}" class="w-6 h-6 rounded-full object-cover mt-0.5" alt="Commenter">
              <div class="flex-1 min-w-0">
                <span class="font-bold text-slate-800 text-[11px] block leading-tight">${escapeHtml(cAuthor)}</span>
                <span class="text-slate-600 text-[11px] leading-snug break-words">${escapeHtml(cData.text)}</span>
              </div>
            `;
            commentContainer.appendChild(div);
          });
        });
    }

    async function addComment(postId) {
      const input = document.getElementById(`input-comment-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      try {
        await db.collection('posts').doc(postId).collection('comments').add({
          text: text,
          authorName: currentUser.displayName || "Warga",
          authorUid: currentUser.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
      } catch (err) {
        alert("Gagal mengirim komentar: " + err.message);
      }
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
    }
  </script>
</body>
</html>
